[project]
name = "openxr-simulator-mcp"
version = "1.6.0"
description = "MCP server for OpenXR Simulator - provides screenshot capture and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
openxr-simulator-mcp = "openxr_simulator_mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["openxr_simulator_mcp.py", "ui_targeting.py", "atomic_json_file.py", "ui_comfort.py", "frame_timing.py"]
